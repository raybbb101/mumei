<title>無銘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Yuji+Boku&display=swap">
<style>
/* 墨の闇に和紙と朱。ゲーム画面いっぱいを使う一枚の舞台 */
:root{--sumi:#0e0c12;--ink2:#1b1720;--washi:#ece2cc;--washi2:#b9ad95;--shu:#d03e2e;--kin:#cda451;--ai:#2c4468;--u:2px;--brush:"Yuji Boku","Hiragino Mincho ProN","Yu Mincho",serif;--dot:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{background:var(--sumi);color:var(--washi);font-family:var(--dot);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#stage{position:relative;width:calc(640*var(--u));height:calc(360*var(--u));overflow:hidden;background:#000;flex:none}
#c{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
.layer{position:absolute;inset:0;pointer-events:none}
/* 上下の帯に載る情報 */
#hud{transition:opacity .5s}
#hud.town .barwrap .lbl{opacity:.9}
.bars{position:absolute;left:calc(14*var(--u));top:calc(9*var(--u));display:grid;gap:calc(4*var(--u));width:calc(190*var(--u))}
.barwrap{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:calc(5*var(--u))}
.barwrap .lbl{font-family:var(--brush);font-size:calc(11*var(--u));color:var(--washi);text-shadow:0 0 2px #000,0 1px 0 #000}
.gauge{height:calc(6*var(--u));background:#0a080cd9;border:calc(1*var(--u)) solid #6a5a38;position:relative;overflow:hidden}
.gauge i{position:absolute;left:0;top:0;bottom:0;width:100%;transition:width .12s linear;background:var(--shu);box-shadow:inset 0 calc(1*var(--u)) 0 #ff8a60}
.gauge.ki i{background:#6aa9d8;box-shadow:inset 0 calc(1*var(--u)) 0 #bfe2ff}
.gauge b{position:absolute;left:0;top:0;bottom:0;background:#fff7;transition:width .55s ease-out .1s}
.hudr{position:absolute;right:calc(14*var(--u));top:calc(9*var(--u));text-align:right;font-size:calc(9.5*var(--u));line-height:1.5;text-shadow:0 1px 0 #000}
.hudr b{font-family:var(--brush);font-weight:400;font-size:calc(13*var(--u));color:var(--kin);display:block}
#bossb{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(13*var(--u));width:calc(330*var(--u));text-align:center;display:none}
#bossb span{font-family:var(--brush);font-size:calc(12*var(--u));display:block;margin-bottom:calc(3*var(--u));color:var(--washi);text-shadow:0 1px 0 #000}
#bossb .gauge{height:calc(5*var(--u))}
#helpline{position:absolute;left:0;right:0;bottom:calc(5*var(--u));text-align:center;font-size:calc(8*var(--u));color:#c9bda4cc;text-shadow:0 1px 0 #000}
#prompt{position:absolute;left:50%;bottom:calc(66*var(--u));transform:translateX(-50%);padding:calc(3*var(--u)) calc(9*var(--u));background:#120e16e8;border:calc(1*var(--u)) solid var(--kin);font-size:calc(10*var(--u));white-space:nowrap;display:none;pointer-events:auto;cursor:pointer}
#prompt kbd{font:inherit;color:var(--kin);margin-right:.5em}
#hint{position:absolute;left:50%;top:calc(66*var(--u));transform:translateX(-50%);background:#0c0a10c4;padding:calc(3*var(--u)) calc(10*var(--u));font-size:calc(9.5*var(--u));white-space:nowrap;opacity:0;transition:opacity .4s;max-width:96%;}
#toast{position:absolute;right:calc(14*var(--u));top:calc(60*var(--u));display:grid;gap:calc(3*var(--u));justify-items:end}
#toast div{background:#120e16e0;border-left:calc(2*var(--u)) solid var(--kin);padding:calc(2*var(--u)) calc(8*var(--u));font-size:calc(9.5*var(--u));animation:tin 3.2s forwards}
@keyframes tin{0%{opacity:0;transform:translateX(8px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#banner{position:absolute;left:50%;top:calc(66*var(--u));transform:translateX(-50%);width:calc(350*var(--u));text-align:center;background:linear-gradient(90deg,#0000,#0e0b12f2 12%,#0e0b12f2 88%,#0000);padding:calc(7*var(--u)) calc(30*var(--u));opacity:0;transition:opacity .5s}
#banner em{font-style:normal;color:var(--kin);font-size:calc(9*var(--u));letter-spacing:.3em}
#banner strong{display:block;font-family:var(--brush);font-weight:400;font-size:calc(21*var(--u));margin:calc(2*var(--u)) 0}
#banner p{margin:0;font-size:calc(9.5*var(--u));line-height:1.6;color:var(--washi2)}
#chapter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .9s}
#chapter em{font-style:normal;font-family:var(--brush);font-size:calc(15*var(--u));color:var(--kin);letter-spacing:.3em;text-shadow:0 2px 6px #000}
#chapter strong{font-family:var(--brush);font-weight:400;font-size:calc(46*var(--u));letter-spacing:.14em;text-shadow:0 2px 0 #000,0 0 18px #000}
/* 語り */
#dlg{position:fixed;left:50%;transform:translateX(-50%);width:min(100vw,calc(620*var(--u)));bottom:max(calc((100vh - 360*var(--u))/2 + 7*var(--u)),env(safe-area-inset-bottom,0px));display:none;pointer-events:auto;cursor:pointer}
#dlgin{position:relative;display:flex;gap:calc(9*var(--u));background:#0f0c14f4;border:calc(1*var(--u)) solid #6a5a38;outline:calc(1*var(--u)) solid #000;padding:calc(8*var(--u)) calc(12*var(--u));min-height:calc(74*var(--u))}
#pframe{flex:none;width:calc(62*var(--u));height:calc(62*var(--u));border:calc(1*var(--u)) solid #6a5a38;background:linear-gradient(#2c2632,#17131c);overflow:hidden}
#pc{width:100%;height:100%;image-rendering:pixelated;display:block}
#dtxt{flex:1;min-width:0}
#dname{font-family:var(--brush);font-size:max(14px,calc(11.5*var(--u)));color:var(--kin);margin-bottom:calc(2*var(--u));min-height:1em}
#dbody{font-size:max(14px,calc(11.5*var(--u)));line-height:1.62;white-space:pre-wrap}
#dbody.nar{color:#d4cbb6}
#dmore{position:absolute;right:calc(9*var(--u));bottom:calc(4*var(--u));color:var(--kin);font-size:calc(9*var(--u));animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#choices{position:fixed;left:50%;transform:translateX(-50%);width:min(94vw,calc(430*var(--u)));bottom:calc((100vh - 360*var(--u))/2 + 88*var(--u));display:none;gap:calc(2*var(--u));pointer-events:auto}
#choices.open{display:grid}
#choices button{all:unset;display:block;cursor:pointer;padding:calc(5*var(--u)) calc(11*var(--u));background:#120e16f2;border:calc(1*var(--u)) solid #4a3f2a;font-size:max(14px,calc(11*var(--u)));line-height:1.45;font-family:var(--dot);color:var(--washi)}
#choices button.on,#choices button:hover,#choices button:focus-visible{border-color:var(--kin);background:#2a1f16f6;color:#fff4d4}
#choices button.on::before{content:"▶ ";color:var(--shu)}
/* 墨の独白 */
#flash{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#060508;gap:1.15em;padding:0 max(24px,8vw);z-index:6;pointer-events:auto;cursor:pointer;opacity:0;transition:opacity .7s;text-align:center}
#flash.show{opacity:1}
#flash p{margin:0;font-family:var(--dot);font-size:max(15px,calc(12.5*var(--u)));line-height:1.75;opacity:0;transform:translateY(4px);transition:opacity .9s,transform .9s;max-width:44em;color:#e6dcc5}
#flash p.in{opacity:1;transform:none}
#flash .more{position:absolute;bottom:6vh;color:var(--kin);font-size:max(12px,calc(9*var(--u)));opacity:0;transition:opacity .4s}
/* 巻物 */
#menu{position:fixed;inset:0;display:none;background:#08070bcf;z-index:5;align-items:center;justify-content:center;pointer-events:auto;padding:16px}
#menuin{width:min(94vw,calc(520*var(--u)));max-height:92vh;overflow:auto;background:var(--washi);color:#201a18;padding:calc(12*var(--u)) calc(18*var(--u));border-left:calc(6*var(--u)) solid #6b4a24;border-right:calc(6*var(--u)) solid #6b4a24;font-size:max(13px,calc(10*var(--u)));line-height:1.6}
#menuin h2{font-family:var(--brush);font-weight:400;font-size:max(22px,calc(20*var(--u)));margin:0 0 .2em}
#tabs{display:flex;gap:.4em;flex-wrap:wrap;border-bottom:1px solid #8a7450;margin-bottom:.8em}
#tabs button{all:unset;cursor:pointer;padding:.25em .8em;font-family:var(--brush);color:#6a5a48}
#tabs button.on,#tabs button:focus-visible{background:#201a18;color:var(--washi)}
.ent{margin:0 0 .75em}.ent b{font-weight:400;font-family:var(--brush);font-size:1.15em;color:#7c1e16;display:block}.ent.done b{color:#6a6256;text-decoration:line-through}
.route{display:grid;grid-template-columns:auto 1fr;gap:.2em .8em;align-items:center;margin-bottom:.9em}.dots{letter-spacing:.2em;color:#7c1e16}
#mclose{all:unset;cursor:pointer;float:right;font-family:var(--brush);padding:.1em .6em;border:1px solid #8a7450}
/* 表紙 */
#title{position:absolute;inset:0;display:flex;pointer-events:auto;transition:opacity 1s}
#tname{position:absolute;right:11%;top:9%;writing-mode:vertical-rl;font-family:var(--brush);font-size:calc(92*var(--u));line-height:1;letter-spacing:.06em;color:#14100f;text-shadow:0 0 calc(1*var(--u)) #fff4,0 0 calc(24*var(--u)) #ffe6c455}
#tseal{position:absolute;right:calc(11% - 18*var(--u));top:calc(9% + 188*var(--u));width:calc(15*var(--u));height:calc(15*var(--u));background:var(--shu);color:#fff3d8;font-family:var(--brush);font-size:calc(11*var(--u));display:grid;place-items:center}
#tsub{position:absolute;left:calc(40*var(--u));top:calc(82*var(--u));font-size:calc(9.5*var(--u));line-height:2;color:#fff4dc;text-shadow:0 1px 2px #000}
#tmenu{position:absolute;left:calc(40*var(--u));bottom:calc(66*var(--u));display:grid;gap:calc(3*var(--u));justify-items:start}
#tmenu button{all:unset;cursor:pointer;font-family:var(--brush);font-size:calc(17*var(--u));padding:calc(1*var(--u)) calc(8*var(--u));color:var(--washi);text-shadow:0 1px 3px #000}
#tmenu button.on,#tmenu button:hover,#tmenu button:focus-visible{color:#fff;background:linear-gradient(90deg,#d03e2ee8,#d03e2e00)}
#tcredit{position:absolute;left:calc(40*var(--u));bottom:calc(12*var(--u));font-size:calc(7.5*var(--u));color:#d4cab2aa}
/* 触れて遊ぶ */
#touch{position:fixed;left:0;right:0;bottom:0;height:0;display:none;z-index:4;pointer-events:none}
body.touchy #touch{display:block}
.tb{position:absolute;display:grid;place-items:center;pointer-events:auto;width:58px;height:58px;border-radius:50%;background:#1b1720b8;border:2px solid #cda45188;color:var(--washi);font-family:var(--brush);font-size:20px;touch-action:none}
.tb:active,.tb.on{background:#d03e2ed0}
.tb.s{width:46px;height:46px;font-size:15px}
@media (prefers-reduced-motion:reduce){#toast div{animation-duration:3.2s}}
</style>

  <div class="bars"><div class="barwrap"><span class="lbl">命</span><div class="gauge" id="ghp"><b id="ghpb"></b><i id="ghpi"></i></div></div><div class="barwrap"><span class="lbl">気</span><div class="gauge ki" id="gki"><i id="gkii"></i></div></div></div>

</div></div>

 async katsuragi(){if(has('dojo_done')){await T('葛城',['燕は、返す時がいちばん美しい。','技は教えた。あとはそなたが、何のために返すかじゃな。']);return;}

 async chigusa(){if(!has('chi1')){set('chi1');await N('朱の鳥居の下で、白い衣の巫女が箒を動かしていた。');await T('千草',['ようこそお参りくださいました。……まあ、ずいぶんお疲れの御様子。']);await T('男',['ここに古い記録があると聞いた。忘れ水のことを、調べたい。']);await N('箒が止まった。');await T('千草',['その名を、どこで?','……いえ、失礼を。ごめんなさい。そのことは、あまり口にされないほうがいい。神代の方々が聞いていますから。']);await T('男',['お前は、何か知っているのか。']);

  const i=await ask(['立ち合う','やめておく']);if(i===1)return;const win=await Game.duel(['mukuu'],{biome:'autumn',title:'緋守の参道',spar:true});P.hp=G.hpMax;if(!win){await T('無空',['遅い。弾いてから考えるな。考えてから弾くな。考えるな。','また来い。酒を持ってな。']);return;}set('muku_done');await T('無空',['……ち。坊主を本気にさせおって。','お主、敵の刃を見ておらんな。相手の呼吸を見ておる。誰に教わったか知らんが、人を斬りすぎた者の目だ。','受けて弾くな。流して、斬れ。']);learn('ryusui');const j=await ask(['「人を斬りすぎた、とは」','「次の技を」']);if(j===0){En();await T('無空',['拙僧も数えるのをやめて坊主になった口よ。','数えるのをやめても、数は減らんぞ。それだけは言っておく。']);}else{Ren();await T('無空',['竹林の先の座頭に会え。あの女の耳は拙僧の目よりよい。']);}},
 async takamaruGate(){G.lock++;Audio2.mood='sad';await N('町を出ようとした時、門の下に白い羽織の侍が立っているのが見えた。');await T('鷹丸',['ようやく会えた。息災そうで何よりだ、蒼馬。']);await N('その名を耳にした瞬間、胸の奥で、何かが鳴った。');await T('男',['……蒼馬。']);await T('鷹丸',['榊蒼馬。神代藩一の剣士で、俺の幼馴染で、たった一人の友だ。','本当に忘れたのか。俺のことも、お前が斬った者たちのことも。……そうか。羨ましいぞ。心の底から。']);Mem('name');

 async osuzu(){if(has('osuzu_done')){await T('お鈴',['聴こえますよ。竹の鳴る音と、あなたの迷い。……そちらの音のほうが、大きいですけどね。']);return;}

 async katsuragiSnow(){if(has('issen_done')){await T('葛城',['行け。この先は、わしの知らぬ道じゃ。']);return;}set('issen_done');await N('峠の地蔵の前で、見覚えのある老人が、雪を払いながら団子を供えていた。');await T('葛城',['遅いぞ。年寄りを雪の中で待たせおって。','……気づいておったか? あの木刀で三度受けた時から、わしは知っておった。そなたが誰か。','霜切り流を神代に伝えたのは、わしじゃよ。榊という融通の利かぬ子に、人の斬り方を教えたのは、この手じゃ。']);await T('男',['……なぜ、言わなかった。']);await T('葛城',['言うて何になる。そなたはわしの弟子ではない。名も持たぬ、ただの客じゃ。そう思いたかったのよ。','最後にひとつ、詫びの代わりに持っていけ。鞘の内で勝負を決める、霜切りの奥の技。','溜めて、溜めて、一息で抜ける。ただ、抜いたあとに何を斬ったかは、そなたが見届けるのじゃぞ。']);learn('issen');const i=await ask(['「榊は、どんな弟子だった」','(頭を下げ、黙って先へ進む)']);if(i===0){En();await T('葛城',['泣き虫じゃった。','木刀で打たれて泣き、握り飯を落として泣き、犬が死んで泣いた。斬れるようになって、泣かなくなった。','わしは、それを上達と呼んだのじゃ。']);}else{Ren();await N('背中に、老人の小さな笑い声が届いた。');}},
 async snowIntro(){G.lock++;await N(['峠の雪は、足首まで積もっていた。','初めて歩く道のはずだった。なのに、この岩を過ぎれば沢に出る、と足が知っていた。']);await T('男',['……帰ってきたのか。俺は。']);G.lock--;},

 async ochiyo(){if(!has('ochi')){set('ochi');await N('村でただ一軒、屋根の残った小屋から、腰の曲がった老婆が出てきた。雪をかき分け、ゆっくりと近づいてくる。');await T('お千代',['ああ。来たね。','やっと来たね、榊の坊ちゃま。']);await T('男',['……俺を、憎くないのか。']);await T('お千代',['憎いよ。','じいさんも、娘も、孫もあんたに斬られたからね。憎いに決まってるじゃないか。','ほら、冷えるよ。粥ができてる。']);await N('老婆は、木の椀を差し出した。');
    const i=await ask(['受け取る','受け取れない']);if(i===0){En();await N('粥は薄く、温かかった。手が、震えて止まらなかった。');}else{await T('お千代',['そうかい。じゃあ、ここに置いとくよ。','あんたが半年後に戻ってきて、村の墓をぜんぶ掘ったときも、そうだったねえ。一口も食べなかった。']);}

 async jizospot(){if(has('jizo')){await N('焼け焦げた地蔵。誰かが新しい赤い前掛けをかけている。');return;}set('jizo');await N(['半ば焼けた地蔵の足元に、小さな団子が供えてある。雪の上に、まだ新しい。','前掛けの裏に、針で文字が縫いこまれていた。','『おゆきさま くにたち さきち おはる ふみのすけ……』','村人の名だった。百七名。縫い目は無骨で、不器用で、右手の男の縫い方だった。']);En();},
 async markerspot(){if(has('marker')){await N('十三本の木札。名はなく、宿場の名だけが記されている。');return;}set('marker');await N(['墓の脇に、墓より小さな木札が十三本。墓ではない。土を掘った跡がない。','一本ずつに、宿場の名が彫ってある。','霧野。緋守。真木。朝比奈。雪屋。','――霧野。']);await T('男',['小太。']);await N('声に出して、初めて、それが誰なのか、腹の底で、わかった。');En();},
 async wellspot(){if(has('letter')){await N('もう井戸には何もない。手紙は懐にある。');return;}if(!has('ochi')){await N('枯れ井戸だ。のぞいても、暗いだけだ。');return;}set('letter');await N(['枯れ井戸の縄を引くと、底から油紙の箱が上がってきた。','中身は、一通の手紙。宛名は、自分の筆跡で。','「名もない俺へ」']);Audio2.mood='sad';

  await UI.flash(['ここまで書いて、正直なことを書いておく。','半分は子らのためだ。','もう半分は、おれが楽になりたいからだ。','百七人の顔を、もう毎晩見なくていい。今、そう思って、おれは少し笑っている。最低だ。だから、おまえに押しつける。'],{slow:true});
  await UI.flash(['名もない俺へ。おまえは、誰も斬っていない顔をしているだろう。','それを羨ましいとは書かない。','好きに生きろ。思い出さなくていい。思い出してもいい。','ただ、もし子らに会ったら、飯を食わせてやってくれ。','──榊蒼馬'],{slow:true});
  Mem('letter');Qd('main4');Audio2.mood='calm';await N('手が、動かなかった。雪が手紙の上に落ちて、墨の字がひとつ、滲んだ。');},

  if(i===0){En(2,'千草は、目を逸らさなかった');await T('千草',['……はい。','あなたは、そう言うんですね。あの夜の人は、きっとそう言わなかった。','だから困るんです。ほんとうに、困る。']);}

 async finalDone(){G.lock++;Audio2.mood='sad';await UI.wait(.7);await N('膝をついた白い羽織に、月の光が落ちた。');await T('鷹丸',['……は。はは。やっと、斬れたか。やっと、斬ってくれたか。','おまえの太刀は……やはり、綺麗だ……。','泉の裏……戻り水が湧いている。飲めば、全部戻る。子らの居場所も。百七人の顔も。俺の、ことも。']);await T('鷹丸',['……なあ。おまえ、団子、好きだったろう。','江戸に出たら……一緒に……']);await N('言葉は、そこで途切れた。雪が、また降り始めた。');

 helpHtml(){return `<div class="ent"><b>動く</b>← → / A D で歩く。Shift を押しながらで走る。R で「常に走る」を切り替え。↑ / Space で跳ぶ。町では ↑↓←→ で全方向に歩ける。</div><div class="ent"><b>斬る</b>J / Z で三連(燕返しを習うと四連)。連打でも続くが、振り抜いた瞬間に押すと「冴」で深く入る。三度続けて受けた相手は「構」えて軽い太刀を防ぐ。三の太刀、弾きの直後、溜めた居合なら割れる。空中でも斬れる。</div><div class="ent"><b>弾く</b>L / C を軽く押す。刃が届く直前なら「極」で相手が崩れ、次の一太刀が重くなる。少し早いと並の弾き。外すと少しの間、弾けない。押しっぱなしは防御で、気を削られる。「危」の文字が出る赤い攻撃は防御できず、並の太刀では止まらない。弾くか、かわすか。</div><div class="ent"><b>かわす</b>I / V。一瞬、刃が当たらなくなる。刃をかわすと「見切」で、次の一太刀が重くなる。</div><div class="ent"><b>居合</b>K / X を短く押すと抜き打ち。長押しで溜めると遠くまで踏み込む。光ってすぐに離すと「極」。</div><div class="ent"><b>その他</b>E / Enter で話す・入る。Q で団子を食べる。M / Tab で巻物を開く。</div>`;},
 // タッチ
